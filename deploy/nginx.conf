# اگر روی سرور خودت nginx داری و Lucky با systemd اجرا می‌شود
# (docker-compose را برای همین حالت می‌توانی فقط سرویس lucky نگه داری)

server {
    listen 80;
    server_name lucky.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lucky.example.com;

    # مسیر گواهی (certbot)
    ssl_certificate     /etc/letsencrypt/live/lucky.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lucky.example.com/privkey.pem;

    # آپلود PDF و دانلود پاورپوینت
    client_max_body_size 200m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /sw.js {
        proxy_pass http://127.0.0.1:3000/sw.js;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        proxy_pass http://127.0.0.1:3000/manifest.webmanifest;
        add_header Cache-Control "no-cache";
    }
}
