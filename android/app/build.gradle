plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.lucky.study'
    compileSdk 34

    defaultConfig {
        applicationId 'ir.lucky.study'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
            // برای نسخهٔ شخصی از کلید دیباگ امضا می‌شود؛ برای انتشار کلید خودت را بگذار
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
