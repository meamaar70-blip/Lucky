<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lucky — دستیار مطالعه دانشجو</title>
  <meta name="description" content="ثبت برنامه کلاسی، آپلود کتاب درس و ساخت خلاصه، تست و پاورپوینت فصل‌به‌فصل" />
  <meta name="theme-color" content="#fbfbfa" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2317171b'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    /* اعمال تم پیش از رندر تا صفحه سفید/سیاه نپرد */
    (function () {
      try {
        var pref = localStorage.getItem('lucky:theme') || 'system';
        var dark = pref === 'dark' ||
          (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themePref = pref;
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">✦</div>
        <div>
          <div class="brand-name">Lucky</div>
          <div class="brand-sub">دستیار مطالعه دانشجو</div>
        </div>
      </div>

      <nav id="nav">
        <button class="nav-item" data-route="dashboard">خانه</button>
        <button class="nav-item" data-route="schedule">برنامه</button>
        <button class="nav-item" data-route="courses">درس‌ها</button>
        <button class="nav-item" data-route="library">فصل‌ها</button>
        <button class="nav-item" data-route="review">مرور <span class="badge-count" id="nav-review-count"></span></button>
        <button class="nav-item" data-route="exams">آزمون‌ها <span class="badge-count" id="nav-exam-count"></span></button>
      </nav>

      <div class="sidebar-foot">
        <button class="nav-item" data-route="settings">تنظیمات</button>
        <div class="sidebar-card" id="side-card">
          <strong id="side-name">خوش آمدید</strong>
          <span id="side-sub">مشخصاتت را کامل کن</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="page-title">
          <div style="display:flex;align-items:center;gap:10px">
            <button class="btn btn-sm menu-btn" id="menu-btn" aria-label="منو">☰</button>
            <h1 id="page-title">داشبورد</h1>
          </div>
          <div class="sub" id="page-sub">خلاصه‌ی وضعیت مطالعه‌ی تو</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex:0 0 auto">
          <button class="theme-btn" data-theme-btn title="حالت تاریک" aria-label="تغییر تم">🌙</button>
          <div class="topbar-actions" id="topbar-actions"></div>
          <div class="add-menu">
            <button class="btn btn-primary btn-sm" id="add-btn" aria-haspopup="true" aria-expanded="false">+ افزودن</button>
            <div class="add-menu-pop" id="add-pop" hidden>
              <button data-add="course">درس تازه</button>
              <button data-add="session">کلاس هفتگی</button>
              <button data-add="exam">آزمون</button>
              <div class="sep"></div>
              <button data-add="book">بارگذاری PDF کتاب</button>
            </div>
          </div>
        </div>
      </div>
      <div id="view" aria-live="polite"></div>
    </main>
  </div>

  <div class="reminders" id="reminders" aria-live="assertive"></div>
  <div class="toasts" id="toasts"></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
