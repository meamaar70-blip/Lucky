name: ساخت APK

on:
  push:
    branches: ['arena/**', main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: جاوا ۱۷
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: بررسی Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK="${SDK:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          ls "$SDK" || true
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true
          echo "java: $(java -version 2>&1 | head -1)"

      - name: ساخت APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode=summary assembleDebug 2>&1 | tee /tmp/gradle.log | tail -60
        continue-on-error: true

      - name: بررسی خروجی
        run: |
          echo "--- انتهای لاگ ---"
          tail -40 /tmp/gradle.log || true
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/*.apk apk/lucky-1.0.apk 2>/dev/null || true
          ls -la apk
          if [ -f apk/lucky-1.0.apk ]; then
            echo "OK=$(sha256sum apk/lucky-1.0.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"
          fi

      - name: آپلود APK
        if: env.OK != ''
        uses: actions/upload-artifact@v4
        with:
          name: lucky-apk
          path: apk/*.apk
          retention-days: 30

      - name: آپلود لاگ ساخت
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/gradle.log
          retention-days: 7

      - name: اعلان خطا
        if: env.OK == ''
        run: |
          LINE=$(grep -m1 -E "^e: |error:|FAILURE:|Could not (resolve|find|download)" /tmp/gradle.log | tr -d '\r' | cut -c1-160)
          echo "::error title=Gradle::$LINE"
          exit 1
